name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24', cache: npm}
      - name: Locked frontend dependencies and generated assets
        run: npm ci && npm run build_assets
      - name: Authentication browser-session transport regression tests
        run: npm run test_auth
      - name: Test feedback popularity alerts
        run: node --test .github/scripts/feedback_alert.test.cjs
      - name: Build disposable backend test image
        run: docker build -t sightreading-test .
      - name: Test full backend with disposable PostgreSQL
        run: docker run --rm sightreading-test
